name: Build and Release

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sevenzip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check arm64
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      artifact: ${{ steps.metadata.outputs.artifact }}
      commit: ${{ steps.metadata.outputs.commit }}
    env:
      SEVENZIP_BUILD_JOBS: '3'
    steps:
      - name: Check out source and pinned 7-Zip submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" -ge 26
          test -f vendor/7zip/C/7zVersion.h
          git submodule status --recursive

      - name: Resolve release version
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, plistlib, re, subprocess
          from pathlib import Path
          info = plistlib.loads(Path('Resources/Info.plist').read_bytes())
          base = info['CFBundleShortVersionString']
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,2}', base):
              raise SystemExit('CFBundleShortVersionString must be a numeric version such as 0.2.2.')
          stable = os.environ['REF_TYPE'] == 'tag'
          if stable:
              if os.environ['REF_NAME'] != 'v' + base:
                  raise SystemExit('Release tag must exactly match v' + base + ' from Resources/Info.plist.')
              version = base
          else:
              version = f"{base}-build.{os.environ['GITHUB_RUN_NUMBER']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          values = {
              'version': version,
              'tag': 'v' + version,
              'prerelease': str(not stable).lower(),
              'artifact': f"sevenzip-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  print(f'{key}={value}', file=output)
          PY

      - name: Build application and native library
        run: bash build.sh

      - name: Check archive operations, navigation, sorting, and languages
        run: |
          bash check.sh
          bash check-browser.sh
          bash check-sorting.sh
          bash check-localizations.sh
          bash check-archives.sh

      - name: Package DMG and complete source archive
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          bash package-dmg.sh "$RELEASE_VERSION"
          python3 scripts/package-source.py "$RELEASE_VERSION"
          cd dist
          shasum -a 256 -c "SevenZip-$RELEASE_VERSION-arm64.dmg.sha256"
          shasum -a 256 -c "SevenZip-$RELEASE_VERSION-source.tar.gz.sha256"

      - name: Save release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*-source.tar.gz
            dist/*-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_type == 'tag' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download checked artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets

      - name: Verify downloaded checksums
        working-directory: release-assets
        run: sha256sum --check -- *.sha256

      - name: Publish DMG and source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = f"""SevenZip {os.environ['RELEASE_VERSION']} for Apple Silicon (arm64), macOS 13 or later.

          Download the DMG, open it, and drag SevenZip.app into Applications.
          This build is ad-hoc signed and is not notarized by Apple. macOS may block first launch.

          The source archive includes the pinned 7-Zip sources and build scripts.
          SHA-256 checksums accompany both downloads.

          Commit: `{os.environ['BUILD_COMMIT']}`
          [Build and check results]({os.environ['RUN_URL']})
          """
          Path('release-notes.md').write_text(notes)
          PY
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          release = json.load(open('existing-release.json'))
          if not release['isDraft'] or release['targetCommitish'] != os.environ['BUILD_COMMIT']:
              raise SystemExit('A published release or a draft for a different commit already exists; it will not be replaced.')
          PY
          else
            flags=(--draft --target "$BUILD_COMMIT" --title "SevenZip $RELEASE_VERSION" --notes-file release-notes.md)
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease)
            else
              flags+=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
